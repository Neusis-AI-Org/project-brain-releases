services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: projectbrain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brain -d projectbrain']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Resource caps. Using top-level mem_limit/cpus so they apply under plain
    # `docker compose up` (deploy.resources is swarm-only in non-swarm mode).
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # 256m entered an OOM crash-loop once BullMQ writer-job payloads (full file
    # bodies of mirrored repos) pushed the AOF dataset past ~209MB — the server
    # was killed during AOF load on every start; 768m then crash-looped the
    # same way once AOF history + fragmentation put load-time RSS at the cap.
    # Headroom for AOF load + save fork. Compact with BGREWRITEAOF if the AOF
    # outgrows the dataset again.
    mem_limit: 1280m
    mem_reservation: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  migrate:
    image: ${IMAGE_REGISTRY:-local}/project-brain-migrate:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: migrate
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    environment:
      DATABASE_URL: postgres://brain:${POSTGRES_PASSWORD:-changeme}@postgres:5432/projectbrain
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${IMAGE_REGISTRY:-local}/project-brain-web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: web
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://brain:${POSTGRES_PASSWORD:-changeme}@postgres:5432/projectbrain
      REDIS_URL: redis://redis:6379
      # Always use Compose DNS in-container. Host-run `pnpm dev` uses the
      # loopback URL from .env instead.
      ROUTER_INTERNAL_URL: http://omniroute:20128
      SCHEDULER_ENABLED: 'false'
      # Request-scoped service — needs headroom for concurrent requests.
      PG_POOL_MAX: ${PG_POOL_MAX_WEB:-25}
    ports:
      # Bind to loopback only — Caddy reaches web over the compose network in
      # prod, and local dev hits localhost:3000 directly. The dev overlay
      # keeps this; prod customers should never expose 3000 publicly.
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # Use 127.0.0.1 explicitly: BusyBox wget on alpine resolves `localhost`
      # to ::1 (IPv6) but Next's standalone server binds only to IPv4 0.0.0.0.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  worker:
    image: ${IMAGE_REGISTRY:-local}/project-brain-worker:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    env_file: .env
    environment:
      NODE_ENV: production
      # Graphify commits hold the whole graphify-out file set (~60MB of
      # strings) plus a 41MB graph.json stats parse in memory at once; V8's
      # default heap cap (~half the container limit) OOM-crashed the process
      # mid-commit. Pin the heap just under mem_limit (1536m) with headroom
      # for buffers and the tsx supervisor.
      NODE_OPTIONS: --max-old-space-size=1152
      DATABASE_URL: postgres://brain:${POSTGRES_PASSWORD:-changeme}@postgres:5432/projectbrain
      REDIS_URL: redis://redis:6379
      SCHEDULER_ENABLED: 'true'
      # Long-lived BullMQ consumers issue mostly serial queries per job.
      PG_POOL_MAX: ${PG_POOL_MAX_WORKER:-5}
      GRAPHIFY_WORKSPACE_DIR: /workspace
      GRAPHIFY_SIDECAR_URL: http://graphify-sidecar:8080
      # The worker resolves the graph builder's model endpoint and passes it to
      # the sidecar, so like web it must override .env's host-loopback value
      # with the compose service hostname — the sidecar dials this URL.
      ROUTER_INTERNAL_URL: http://omniroute:20128
      # Required at worker startup (apps/worker/src/index.ts enforces). NOT
      # enforced here via ${VAR:?} because compose evaluates that at parse
      # time, which would break `docker compose config` and `docker compose
      # up postgres` for operators who only want unrelated services. install.sh
      # generates the token; pbtest-redeploy.sh rotates it per redeploy.
      GRAPHIFY_SIDECAR_TOKEN: ${GRAPHIFY_SIDECAR_TOKEN:-}
    volumes:
      - graphify_workspace:/workspace
    networks:
      - default
      - graphify_internal
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      graphify-sidecar: { condition: service_healthy }
    # Real liveness probe: open a TCP socket to redis:6379, send a RESP PING,
    # require +PONG back. The worker is a BullMQ consumer — if it can't talk
    # to Redis, it's a dead box. node:alpine has no curl/redis-cli, so we use
    # the built-in `net` module (no extra deps, no Dockerfile churn).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const net=require('net');const s=net.connect(6379,'redis');let b='';s.setTimeout(3000,()=>{s.destroy();process.exit(1)});s.on('connect',()=>s.write('*1\r\n$4\r\nPING\r\n'));s.on('data',d=>{b+=d.toString();if(b.startsWith('+PONG')){s.end();process.exit(0)}});s.on('error',()=>process.exit(1));s.on('close',()=>{if(!b.startsWith('+PONG'))process.exit(1)});
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  graphify-sidecar:
    # Locked-down Graphify runtime. The worker prepares the repo checkout and
    # sends only a workspace path + model settings; this service never receives
    # GitHub credentials and is only attached to the internal graphify network.
    image: ${IMAGE_REGISTRY:-local}/project-brain-graphify-sidecar:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/graphify-sidecar/Dockerfile
    environment:
      # Required — see comment under worker.environment. If unset, the
      # sidecar's own bootstrap rejects every request (fail-closed inside the
      # container) and the worker refuses to start at all.
      GRAPHIFY_SIDECAR_TOKEN: ${GRAPHIFY_SIDECAR_TOKEN:-}
      GRAPHIFY_WORKSPACE_ROOT: /workspace
      # Wall-clock budget for one `graphify extract`. The 30-minute default
      # suits a docs-sized corpus; a mirrored source repo is one LLM call per
      # file and needs far longer (astropy: ~1800 files at ~50/min). The
      # worker's own ceiling is derived from this — keep them in step.
      GRAPHIFY_TIMEOUT_S: ${GRAPHIFY_TIMEOUT_S:-1800}
      # In-flight LLM calls; size to the provider's requests-per-minute
      # budget. See MAX_CONCURRENCY in server.py.
      GRAPHIFY_MAX_CONCURRENCY: ${GRAPHIFY_MAX_CONCURRENCY:-3}
      # graphify forces its ollama backend serial (a single-GPU guard,
      # graphifyy issue #798) unless this opt-in is set — but our "ollama"
      # endpoint is OmniRoute, not a local GPU, so parallel chunks are safe.
      # Without this, --max-concurrency is silently ignored.
      GRAPHIFY_OLLAMA_PARALLEL: '1'
      # Per-chunk input-token cap for semantic extraction (graphify
      # --token-budget, upstream default 60000). See TOKEN_BUDGET in server.py.
      GRAPHIFY_TOKEN_BUDGET: ${GRAPHIFY_TOKEN_BUDGET:-60000}
      # "1" = AST-only extraction (--code-only): docs/papers/images skipped,
      # zero LLM calls. For source-code corpora; doc-centric brains need 0.
      GRAPHIFY_CODE_ONLY: ${GRAPHIFY_CODE_ONLY:-0}
      HTTP_PROXY: ${GRAPHIFY_EGRESS_PROXY:-http://graphify-egress-proxy:3128}
      HTTPS_PROXY: ${GRAPHIFY_EGRESS_PROXY:-http://graphify-egress-proxy:3128}
      # `omniroute` is exempt from the egress proxy: graph builds now reach
      # their model through the router, and squid's SSRF hardening denies
      # private-IP destinations, which is exactly what a sibling container is.
      # The router itself does the outbound provider call from the default
      # network, so egress is still centralized — just one hop later.
      NO_PROXY: localhost,127.0.0.1,::1,omniroute
    volumes:
      - graphify_workspace:/workspace
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - graphify_internal
    depends_on:
      graphify-egress-proxy: { condition: service_started }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://localhost:8080/health",timeout=3).status==200 else 1)',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # 1g OOM-killed the graphify process during graph merge/clustering on a
    # ~48k-node corpus (django mirror): cgroup memory.peak sat exactly at the
    # limit with oom_kill counts matching the failed runs. Sized for ~50k
    # nodes with headroom; grows with corpus size.
    mem_limit: 1536m
    mem_reservation: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  graphify-egress-proxy:
    # The sidecar's only route to LLM APIs. Operators should set
    # GRAPHIFY_EGRESS_ALLOWED_HOSTS to their enterprise LLM gateway host(s).
    image: ${IMAGE_REGISTRY:-local}/project-brain-graphify-egress-proxy:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/graphify-egress-proxy/Dockerfile
    environment:
      GRAPHIFY_EGRESS_ALLOWED_HOSTS: ${GRAPHIFY_EGRESS_ALLOWED_HOSTS:-generativelanguage.googleapis.com,api.openai.com,api.anthropic.com}
    networks:
      - default
      - graphify_internal
    restart: unless-stopped
    # 128m sat at ~89% in practice, because squid reserves cache_mem (256 MB
    # by default) regardless of `cache deny all`. The entrypoint now pins
    # cache_mem to 0; this keeps headroom for connection state on top.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  omniroute:
    # OmniRoute LLM gateway sidecar (https://github.com/diegosouzapw/OmniRoute).
    # Additive routing path for coding agents (neusis-code etc.) — PB's own LLM
    # calls and the external litellm-proxy deployment are unaffected. PB's web
    # app mints per-user gateway keys against its /api/v1/registered-keys API
    # using ROUTER_ADMIN_TOKEN (created once in the OmniRoute dashboard after
    # first boot — see docs/router.md). In prod, Caddy publishes it at
    # https://${ROUTER_DOMAIN} so agents on developer machines can reach it.
    image: diegosouzapw/omniroute:3.8.49
    environment:
      NODE_ENV: production
      PORT: '20128'
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
      # OmniRoute ships as a single-user local proxy: without this flag its
      # OpenAI/Anthropic client endpoints accept anonymous traffic and even
      # revoked keys (verified on 3.8.49). This deployment is multi-user and
      # published through Caddy, so a valid registered key is mandatory.
      REQUIRE_API_KEY: 'true'
      # Lets PB's /admin/router fill a selected key into generated agent
      # configs (management-scope only, audited PB-side). Deliberate
      # tradeoff: keys are no longer strictly shown-once.
      ALLOW_API_KEY_REVEAL: 'true'
      # OmniRoute admits only N "heavy" chat bodies (>256KB or >~32k est
      # tokens) at once and 503s the rest (chat_admission_busy). The default
      # of 1 silently serialized graphify's parallel semantic chunks — every
      # ~80k-token chunk is a ~320KB body. Sized to GRAPHIFY_MAX_CONCURRENCY.
      OMNIROUTE_CHAT_MAX_HEAVY_IN_FLIGHT: '10'
    # graphify_internal as well as the default network: the graphify sidecar
    # lives only on that internal network and now resolves its model through
    # the router (see its NO_PROXY entry).
    networks:
      - default
      - graphify_internal
    volumes:
      # SQLite DB, settings, and AES-256-GCM-encrypted provider credentials.
      - omniroute_data:/app/data
    ports:
      # Loopback only — dev hits localhost:20128 directly; prod goes through
      # Caddy on the compose network. Never expose 20128 publicly.
      - '127.0.0.1:20128:20128'
    # Upstream compose uses a long grace period so in-flight LLM streams can
    # finish before shutdown.
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # healthcheck.mjs ships in the image workdir (upstream's own probe).
      test: ['CMD', 'node', 'healthcheck.mjs']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # 1g was enough for API-key and OAuth connectors, but not for a reseller
    # catalog: connecting OpenRouter (~900 models, a 1 MB catalog the gateway
    # warms into memory at startup) drove RSS to the cap and the kernel
    # OOM-killed the process in a loop — the container stayed "running" while
    # every admin call timed out, which surfaces in the UI as "Router sidecar
    # is unreachable". Verified on pbtest 2026-08-17: anon-rss 1002 MB at kill,
    # 4 restarts. The host has ~2.6 GB free, and every other service on it runs
    # an order of magnitude under its own cap.
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  postgres_data:
  redis_data:
  graphify_workspace:
  omniroute_data:

networks:
  graphify_internal:
    internal: true

# Production overlay. Compose with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this overlay adds on top of the base stack:
#   - caddy           Auto-HTTPS reverse proxy (Let's Encrypt). Replaces the
#                     plain-HTTP nginx that used to live in the base file.
#   - postgres-backup Daily logical pg_dump → ./backups/, with retention.
#   - workspace-backup Daily snapshot of the graphify workspace volume.
#   - web/worker      Restart policies hardened, port 3000 bound to loopback
#                     only (Caddy reaches it over the compose network).
#   - graphify        Direct Graphify sidecar plus allowlist egress proxy.
#
# Required env vars (set in .env):
#   APP_DOMAIN        e.g. brain.acme.com — the Caddyfile reads this.
#   ACME_EMAIL        contact email for Let's Encrypt cert issuance.
#
# Optional env vars (set in .env):
#   TLS_DIRECTIVE       Empty (default) → Let's Encrypt auto-issue. Set to
#                       `tls /certs/fullchain.pem /certs/privkey.pem` to use
#                       customer-provided certs from ./certs (see docs/INSTALL.md).
#   BACKUP_KEEP_DAYS    default 7
#   BACKUP_KEEP_WEEKS   default 4
#   BACKUP_KEEP_MONTHS  default 6
#   WORKSPACE_BACKUP_RETENTION_DAYS  default 14

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'   # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set in .env for the prod overlay}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env for the prod overlay}
      # Empty → Caddy uses its built-in Let's Encrypt ACME flow (default).
      # Set in .env to e.g. `tls /certs/fullchain.pem /certs/privkey.pem` for
      # customer-provided certs (enterprise PKI / internal CA).
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Customer-provided TLS certs (only consulted when TLS_DIRECTIVE is set).
      # Mount is harmless when the directory is empty / not used.
      - ./certs:/certs:ro
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  postgres-backup:
    # Logical pg_dump on cron. Retention is handled by the image. Restore
    # with scripts/restore.sh — see docs/BACKUP.md.
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: projectbrain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: '8080'
      # Match the format scripts/upgrade.sh and scripts/restore.sh expect.
      POSTGRES_EXTRA_OPTS: '-Z 6 --quote-all-identifiers'
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  workspace-backup:
    # Tar+gz the graphify workspace volume nightly. The volume holds shallow
    # git clones + intermediate graphify artifacts — losing it forces every
    # project's next graph rebuild to start cold (re-clone, re-extract). Not
    # data loss, but expensive in LLM spend. Retention is short by design.
    image: offen/docker-volume-backup:v2
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: '0 3 * * *'
      BACKUP_FILENAME: 'workspace-%Y-%m-%dT%H-%M-%S.tar.gz'
      BACKUP_PRUNING_PREFIX: 'workspace-'
      BACKUP_RETENTION_DAYS: ${WORKSPACE_BACKUP_RETENTION_DAYS:-14}
      BACKUP_COMPRESSION: 'gz'
    volumes:
      - graphify_workspace:/backup/workspace:ro
      - ./backups/workspace:/archive
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  caddy_data:
  caddy_config:
